name: Playwright CI

on:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: mcr.microsoft.com/playwright:v1.54.1-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Prepare report zip for email
        if: always()
        run: |
          mkdir -p email-report
          cp -R playwright-report email-report/
          zip -r playwright-report.zip email-report

      - name: Upload Playwright and Reporting Labs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report/reporting-labs/
            test-results/
            reporting-labs.history.json
            playwright-report.zip
          if-no-files-found: warn

      - name: Send report by email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Playwright report for ${{ github.repository }}
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          html_body: |
            <h2>Playwright run completed</h2>
            <p>Repository: <b>${{ github.repository }}</b></p>
            <p>Workflow run: <b>${{ github.run_id }}</b></p>
            <p>Branch: <b>${{ github.ref_name }}</b></p>
            <p>The attached zip contains the Reporting Labs HTML report and the raw Playwright output.</p>
          attachments: playwright-report.zip
          convert_markdown: true
          secure: true
